name: CI

on:
  push:
    branches: ["**"] # every branch (tags are handled by release.yml)
  pull_request:
  workflow_dispatch:
  workflow_call: # reused by release.yml

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen # run Qt without a display
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q --cov --cov-report=term --cov-report=xml --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 14

  firmware-logic:
    # The firmware's protocol + safety logic (hub.ts, protocol.ts) run with Node
    # against the same scenarios the simulator passes in tests/test_firmware_conformance.py.
    name: Firmware logic (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/host
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test

  firmware-makecode:
    # Compiles the extension (blocks, Motion:bit and Bluetooth bindings) with the
    # real MakeCode toolchain. Needs network access to the MakeCode compile service.
    name: Firmware build (MakeCode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/makecode
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g pxt
      - run: pxt target microbit
      - run: pxt install
      - run: pxt build

  build:
    # Continuous delivery of development builds: every PR and every push to main
    # produces a downloadable .exe (Actions run page -> Artifacts).
    name: Build Windows exe
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [lint, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[build]"
      - name: Build and smoke-test
        shell: pwsh
        run: ./packaging/build.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: MicrobitHub-dev-${{ github.sha }}
          path: dist/MicrobitHub.exe
          retention-days: 14
