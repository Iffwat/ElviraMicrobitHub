name: Release

# Push a version tag to publish a GitHub Release with the Windows exe:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags with a suffix (v0.2.0-beta.1) are published as pre-releases.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish
    needs: ci
    runs-on: windows-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[build]"

      - name: Check tag matches package version
        shell: pwsh
        run: |
          $version = python -c "import microbithub; print(microbithub.__version__)"
          $tag = "${{ github.ref_name }}"
          if ($tag -notlike "v$version*") {
            throw "Tag $tag does not match microbithub.__version__ = $version. Update src/microbithub/__init__.py."
          }
          Write-Host "Releasing version $version (tag $tag)"

      - name: Build and smoke-test
        shell: pwsh
        run: ./packaging/build.ps1 -Python python

      - name: Name artifact and checksum
        shell: pwsh
        run: |
          $name = "MicrobitHub-${{ github.ref_name }}-windows-x64.exe"
          Move-Item dist/MicrobitHub.exe "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -Encoding ascii "dist/$name.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MicrobitHub-*.exe
            dist/MicrobitHub-*.exe.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
